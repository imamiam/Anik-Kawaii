{% extends "base.html" %}
{% block content %}
<style>
    body {
        background-image: url('{{ base_url }}/static/img/bg.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }
    
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.15);
        z-index: -1;
    }
</style>

<div class="neo-window bg-white mx-auto" style="max-width: 500px; margin-top: 50px;">
    <div class="neo-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span class="ms-2" style="font-family: 'Rockwell', serif;">edit_merch.exe</span>
    </div>
    <div class="p-4">
        <form action="/edit/{{ product.id }}" method="POST">
            <input type="hidden" name="admin" value="{{ 'True' if is_admin else 'False' }}">
            <input type="hidden" name="user_id" value="{{ user_id }}">

            <div class="mb-3 text-start">
                <label class="fw-bold">Product Name</label>
                <input type="text" name="name" class="form-control border-3 border-dark" value="{{ product.name }}" required>
            </div>

            <div class="mb-3 text-start">
                <label class="fw-bold">Brand Name</label>
                <input type="text" name="brand" class="form-control border-3 border-dark" value="{{ product.brand }}" required>
            </div>
            
            <div class="mb-3 text-start">
                <label class="fw-bold">Category</label>
                <select name="category" class="form-select border-3 border-dark" required>
                    <option value="Keychains" {% if product.category == 'Keychains' %}selected{% endif %}>Keychains</option>
                    <option value="Figurines" {% if product.category == 'Figurines' %}selected{% endif %}>Figurines</option>
                    <option value="Plushies" {% if product.category == 'Plushies' %}selected{% endif %}>Plushies</option>
                </select>
            </div>

            <div class="mb-3 text-start">
                <label class="fw-bold">Image Filename</label>
                <input type="text" name="image" class="form-control border-3 border-dark" value="{{ product.image }}" required>
            </div>

            <div class="row">
                <div class="col-6 mb-3 text-start">
                    <label class="fw-bold">Price</label>
                    <input type="number" step="0.01" name="price" class="form-control border-3 border-dark" value="{{ product.price }}" required>
                </div>
                <div class="col-6 mb-3 text-start">
                    <label class="fw-bold">Stock</label>
                    <input type="number" name="stock" class="form-control border-3 border-dark" value="{{ product.stock }}" required>
                </div>
            </div>

            <button type="submit" class="btn btn-kawaii w-100 py-2 fw-bold mt-3 border-3 border-dark" style="box-shadow: 4px 4px 0px black;">
                ✨ SAVE CHANGES ✨
            </button>
        </form>
    </div>
</div>
{% endblock %}
