{% extends "base.html" %}
{% block content %}
<div class="neo-window bg-white mx-auto" style="max-width: 500px; margin-top: 50px;">
    <div class="neo-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span class="ms-2" style="font-family: 'Rockwell', serif;">add_merch.exe</span>
    </div>
    <div class="p-4">
        <form action="/add_product" method="POST">
            
            <div class="mb-3 text-start">
                <label class="fw-bold">Product Name</label>
                <input type="text" name="name" class="form-control border-3 border-dark" placeholder="e.g. Kirby Keychain" required>
            </div>
            
            <div class="mb-3 text-start">
                <label class="fw-bold">Category</label>
                <select name="category" class="form-select border-3 border-dark" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="Keychains">Keychains</option>
                    <option value="Figurines">Figurines</option>
                    <option value="Plushies">Plushies</option>
                </select>
            </div>

            <div class="mb-3 text-start">
                <label class="fw-bold">Image Filename</label>
                <input type="text" name="image" class="form-control border-3 border-dark" placeholder="kirby_keychain.png" required>
                <small class="text-muted">Must be in static/img/products/</small>
            </div>

            <div class="row">
                <div class="col-6 mb-3 text-start">
                    <label class="fw-bold">Price</label>
                    <input type="number" step="0.01" name="price" class="form-control border-3 border-dark" placeholder="0.00" required>
                </div>
                <div class="col-6 mb-3 text-start">
                    <label class="fw-bold">Stock</label>
                    <input type="number" name="stock" class="form-control border-3 border-dark" placeholder="0" required>
                </div>
            </div>

            <button type="submit" class="btn btn-kawaii w-100 py-2 fw-bold mt-3 border-3 border-dark" style="box-shadow: 4px 4px 0px black;">
                UPLOAD TO INVENTORY ✨
            </button>
        </form>
    </div>
</div>
{% endblock %}
